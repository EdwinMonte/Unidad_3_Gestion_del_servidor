[global]
    workgroup = WORKGROUP
    server role = standalone server
    security = user
    map to guest = Never
    interfaces = lo ens33
    bind interfaces only = yes
    hosts allow = 127.0.0.1 192.168.246.0/24
    server min protocol = SMB2

[Unidad3]
    path = /srv/raid_unidad3/compartido
    browseable = yes
    read only = no
    valid users = u3red
    create mask = 0660
    directory mask = 2770
